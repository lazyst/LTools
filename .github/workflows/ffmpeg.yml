name: ffmpeg

# 手动编一份「只服务录屏」的精简 ffmpeg，挂成本仓库的 release 附件
# （tag 形如 `ffmpeg-9.0.2`，附件名 `ffmpeg.exe`）。
#
# 发布流水线（release.yml）不自己编：它跑 tools/fetch-ffmpeg.ps1 直接取这份附件
# （约 30 MB，替代 gyan.dev essentials 的 100 MB）。改参数 / 升版本时在这里重跑一次。
#
# 为什么不用官方构建：LTools 的视频走 rawvideo 管道、声音走 WAV 文件，
# 不用 gdigrab / dshow / fontconfig / gnutls，官方构建里那一大堆编解码器全是白带的体积。
on:
  workflow_dispatch:
    inputs:
      version:
        description: FFmpeg 版本（对应源码 tag n<版本>，如 9.0.2）
        default: '9.0.2'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 只借它装一棵 MSYS2；包由 tools/build-ffmpeg.ps1 自己 pacman 装。
      # 别用这里的 install: —— 实测它装进了另一棵 MSYS2 树，而脚本用的是 C:\msys64：
      # run 45951411436 的探针显示 /mingw64/bin 里没有 gcc / make / nasm，
      # configure 于是只报一句「C compiler test failed」。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          cache: false

      - name: Locate MSYS2
        shell: pwsh
        run: |
          Write-Host "MSYS2_LOCATION=$env:MSYS2_LOCATION MSYS2_ROOT=$env:MSYS2_ROOT"
          foreach ($p in 'C:\msys64\usr\bin\bash.exe', 'C:\msys64\mingw64\bin\gcc.exe') {
            if (Test-Path $p) { Write-Host "有：$p" } else { Write-Host "没有：$p" }
          }

      - name: Build
        shell: pwsh
        run: ./tools/build-ffmpeg.ps1 -Version ${{ inputs.version }}

      # configure 挂掉时它只打一句「C compiler test failed」，真正的原因（缺库 / 找不到 gcc /
      # 链接器报错）全在 config.log 里。注意 config.log 的尾部是几百行变量清单，
      # 所以按关键字捞中间的报错段，别用 -Tail。
      - name: Dump configure log
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem "$env:TEMP\opencode\ffmpeg-build-${{ inputs.version }}\src\*\ffbuild\config.log" -ErrorAction SilentlyContinue
          if (-not $logs) { Write-Host '没有 config.log（失败发生在 configure 之前）'; exit 0 }
          foreach ($f in $logs) {
            Write-Host "=== $($f.FullName) ==="
            $hits = Select-String -Path $f.FullName -Pattern 'error|Error|denied|conftest|not found|cannot|unable|ld:' -Context 2,2
            if ($hits) { $hits | Select-Object -First 30 | ForEach-Object { $_.ToString() } }
            else { Write-Host '（没捞到关键字，打前 120 行）'; Get-Content $f.FullName -TotalCount 120 }
          }

      # 编出来先自己用一遍：libx264 + mp4、GIF 两遍调色板、rawvideo 管道，三条路各跑一次。
      # 漏了哪个滤镜 / 编码器在这里就红，不用等发版后用户报「导出失败」。
      - name: Smoke
        shell: pwsh
        run: |
          $ff = 'runtime/ffmpeg/ffmpeg.exe'
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg-smoke'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          # 1) 编码 + mp4 封装（录屏主路径）
          & $ff -y -hide_banner -loglevel error -f lavfi -i "color=c=black:s=64x64:r=10:d=1" `
                -c:v libx264 -preset veryfast -pix_fmt yuv420p (Join-Path $tmp 'a.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'libx264 / mp4 不可用' }

          # 2) rawvideo 管道进（录屏就是这样喂帧的）
          $raw = Join-Path $tmp 'raw.bgra'
          [IO.File]::WriteAllBytes($raw, (New-Object byte[] (64 * 64 * 4 * 10)))
          Get-Content $raw -AsByteStream -Raw |
            & $ff -y -hide_banner -loglevel error -f rawvideo -pixel_format bgra -video_size 64x64 -framerate 10 `
                  -i pipe:0 -c:v libx264 -pix_fmt yuv420p (Join-Path $tmp 'b.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'rawvideo 管道不可用' }

          # 3) GIF 两遍调色板
          & $ff -y -hide_banner -loglevel error -i (Join-Path $tmp 'a.mp4') `
                -vf "fps=10,scale=64:-1:flags=lanczos,palettegen=stats_mode=diff" (Join-Path $tmp 'p.png')
          if ($LASTEXITCODE -ne 0) { throw 'palettegen 不可用' }
          & $ff -y -hide_banner -loglevel error -i (Join-Path $tmp 'a.mp4') -i (Join-Path $tmp 'p.png') `
                -lavfi "fps=10,scale=64:-1:flags=lanczos[x];[x][1:v]paletteuse" (Join-Path $tmp 'c.gif')
          if ($LASTEXITCODE -ne 0) { throw 'paletteuse / gif 不可用' }

          # 4) 声音：wav 进 + aac 出（录屏混音后的成品就是这条）
          & $ff -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=1" -c:a aac (Join-Path $tmp 'd.m4a')
          if ($LASTEXITCODE -ne 0) { throw 'aac 不可用' }

          Get-ChildItem $tmp | Format-Table Name, Length | Out-String | Write-Host

      # 用 API 而不是 softprops/action-gh-release：那个 action 建完 release 会把它的文件列表
      # 当成这个 release 的完整内容。tag `ffmpeg-<版本>` 只需要一个二进制附件，而发布版的
      # zip / 7z 在别的 tag 上，别让一次失败重跑把这里变成后建的那份。
      - name: Upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "ffmpeg-$VERSION"
          $title = "ffmpeg $VERSION (LTools 精简构建)"
          $notes = "LTools 录屏用的精简 ffmpeg（静态单文件，GPLv3，由 tools/build-ffmpeg.ps1 编译）。`n`n" +
                   "tools/fetch-ffmpeg.ps1 会取这个附件；release.yml 打包时用它替代 gyan.dev essentials。"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # 标成 pre-release：它不是 LTools 的版本发布。这也很关键 —— release.yml 的
            # generate_release_notes 会把「上一个正式 release」当基线，ffmpeg 的 tag 指向
            # 的正是当前 master，不排除它的话自动生成的更新说明会是空的。
            gh release create $tag --title $title --notes $notes --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw "创建 release $tag 失败" }
          }
          gh release upload $tag runtime/ffmpeg/ffmpeg.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 ffmpeg.exe 失败" }
