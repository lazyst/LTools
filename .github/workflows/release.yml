name: release

# 打 v* tag 时自动构建独立部署 zip 并上传到该 tag 对应的 GitHub Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # 创建/更新 release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 录屏用的 ffmpeg 不进仓库（约 100 MB），发布前临时下载到 runtime/ffmpeg/
      # 再由 csproj 的 Content 通配拷进输出目录。下载失败就直接让 job 失败：
      # 少这一份的包会让「录屏」在用户机器上报错。
      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      # 独立部署：内嵌 .NET 运行时，用户免装 .NET 即可运行
      # 显式指定 csproj：目录里同时有 .sln 与 .csproj，不指定时 dotnet 会去构建 sln，
      # 搭配 -o 会触发 NETSDK1194（“--output 不支持构建 solution”）
      - name: Publish self-contained
        run: dotnet publish LTools.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Pack archives
        shell: pwsh
        run: |
          # 两种压缩、内容一样：
          # - zip 谁都能解；
          # - 7z（LZMA2 + solid）比 zip 小一截，Win11 24H2+ 资源管理器能直接解，Win10 要装 7-Zip。
          # 两个都传，用户按自己的机器挑。
          New-Item -ItemType Directory -Path staging/LTools -Force | Out-Null
          Copy-Item publish/* staging/LTools/ -Recurse
          $ver = ${env:GITHUB_REF_NAME}   # 如 v2.2.0
          Compress-Archive -Path staging/LTools -DestinationPath "LTools-$ver-win-x64.zip" -CompressionLevel Optimal
          $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") |
                      Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) { $sevenZip = '7z' }
          & $sevenZip a -t7z -mx=9 -ms=on -mmt=on "LTools-$ver-win-x64.7z" staging\LTools | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z 打包失败（退出码 $LASTEXITCODE）" }
          Get-Item "LTools-$ver-win-x64.zip","LTools-$ver-win-x64.7z" | Format-List Name,Length

      - name: Create/Update release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LTools-${{ github.ref_name }}-win-x64.zip
            LTools-${{ github.ref_name }}-win-x64.7z
          generate_release_notes: true   # 自动从 commits 生成 release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
